<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Moda Íntima & Esportiva</title>
    <!-- Bootstrap CSS (Para deixar o design moderno e responsivo no celular) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Para usarmos ícones nos botões) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Animate.css (Para transições suaves nas telas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }
        /* Estilização suave para ocultar elementos na impressão do relatório de inventário */
        @media print {
            .navbar, .alert, .btn, #input-leitor, #status-leitor, .text-muted, .btn-outline-danger {
                display: none !important;
            }
            body {
                background-color: #fff;
            }
            .card {
                border: none !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Menu de Navegação Responsivo (Fica compacto no celular com botão de menu) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="bi bi-box-seam-fill me-2 text-warning"></i>ESTOQUE MODA
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="bi bi-grid-3x3-gap-fill me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('cadastrar') }}">
                            <i class="bi bi-plus-circle-fill me-1"></i> Cadastrar SKU
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('movimentar') }}">
                            <i class="bi bi-arrow-left-right me-1"></i> Movimentar (E/S)
                        </a>
                    </li>
                    <!-- Novo Botão de Inventário Adicionado à Barra de Navegação -->
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-warning btn-sm fw-bold text-dark px-3" href="{{ url_for('inventario') }}">
                            <i class="bi bi-box-seam me-1"></i> Balanço/Inventário
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Container Principal onde o conteúdo das outras páginas será injetado -->
    <div class="container pb-5">
        <!-- Exibição de Mensagens de Alerta (Sucesso, Erro, etc.) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Bloco que será substituído pelo conteúdo específico de cada página -->
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS Bundle (Necessário para o menu funcionar no celular) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
